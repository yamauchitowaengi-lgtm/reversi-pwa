<!doctype html>
<html>
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d4d3c">
<meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>リバーシ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 盤面を主役に、左に対局エリア、右にキャラ選択と設定。狭い画面では縦に積む。 */
:root {
  --bg: #e7eceb;
  --surface: #f4f7f6;
  --surface-2: #dde4e1;
  --fg: #12201a;
  --muted: #52645c;
  --line: #c3cec9;
  --primary: #1d4d3c;
  --on-primary: #f2f7f4;
  --board: #2f6e54;
  --grid: #1b4636;
  --accent: #f2b63a;
  --on-accent: #2a1d00;
  --scrim: rgba(8, 16, 13, .8);
  --scrim-fg: #f2f7f4;
  --portrait-bg: #34455a;
  --sb-hi: #5b6269;
  --sb-lo: #0d0f11;
  --sw-hi: #ffffff;
  --sw-lo: #cfd5d8;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412;
    --surface: #161f1b;
    --surface-2: #1d2823;
    --fg: #e3ece7;
    --muted: #8ca197;
    --line: #2a3832;
    --primary: #8ad6b3;
    --on-primary: #0c1a14;
    --board: #245241;
    --grid: #133024;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412;
  --surface: #161f1b;
  --surface-2: #1d2823;
  --fg: #e3ece7;
  --muted: #8ca197;
  --line: #2a3832;
  --primary: #8ad6b3;
  --on-primary: #0c1a14;
  --board: #245241;
  --grid: #133024;
  color-scheme: dark;
}

[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 28px 48px;
}
.app { max-width: 64rem; margin-inline: auto; display: grid; gap: 1.5rem; }
.head { display: grid; gap: .35rem; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.4rem;
  letter-spacing: .06em;
  line-height: 1.2;
  text-wrap: balance;
}
.lead { margin: 0; color: var(--muted); max-width: 40rem; }

.layout {
  display: grid;
  grid-template-columns: minmax(0, 34rem) minmax(18rem, 1fr);
  gap: 2rem;
  align-items: start;
}
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 2rem; }
}

/* scoreboard */
.stage { min-width: 0; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.pcard {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas: "av who cnt" "gg gg gg";
  align-items: center;
  gap: .55rem .6rem;
  min-width: 0;
  padding: .65rem .75rem;
  border: 2px solid var(--line);
  border-radius: .8rem;
  background: var(--surface);
  transition: border-color .2s;
}
.pcard[data-active="true"] { border-color: var(--primary); }
.pcard[data-win="true"] { border-color: var(--accent); }
.avatar { grid-area: av; position: relative; width: 2.8rem; height: 2.8rem; }
.avatar img {
  display: block; width: 100%; height: 100%;
  border-radius: 50%; object-fit: cover;
  background: var(--portrait-bg);
  border: 2px solid var(--line);
}
.chip { width: 1.8rem; height: 1.8rem; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--line); }
.avatar .chip { position: absolute; right: -.25rem; bottom: -.25rem; width: 1.1rem; height: 1.1rem; border: 2px solid var(--surface); box-shadow: none; }
.chip.b { background: radial-gradient(circle at 34% 28%, var(--sb-hi), var(--sb-lo) 62%); }
.chip.w { background: radial-gradient(circle at 34% 28%, var(--sw-hi), var(--sw-lo) 68%); }
.who { grid-area: who; display: grid; min-width: 0; line-height: 1.3; }
.who b { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count {
  grid-area: cnt;
  font-size: 1.8rem; font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.gauge { grid-area: gg; display: grid; gap: .2rem; min-width: 0; }
.bar {
  height: .5rem; border-radius: 999px; overflow: hidden;
  background: var(--surface-2); border: 1px solid var(--line);
}
.bar i { display: block; height: 100%; width: 0; background: var(--gc, var(--primary)); transition: width .35s; }
.gauge small {
  font-size: .72rem; color: var(--muted); line-height: 1.3;
  font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gauge[data-ready="true"] .bar { box-shadow: 0 0 0 2px var(--accent); }
.gauge[data-ready="true"] small { color: var(--fg); font-weight: 700; }

@media (max-width: 480px) {
  .pcard { padding: .55rem .6rem; gap: .45rem .45rem; }
  .avatar { width: 2.3rem; height: 2.3rem; }
  .avatar .chip { width: .9rem; height: .9rem; }
  .who b { font-size: .86rem; }
  .who span { font-size: .66rem; }
  .count { font-size: 1.4rem; }
  .scores { gap: .5rem; }
}
.say { display: flex; align-items: center; gap: .6rem; margin: .7rem 0 0; min-height: 2.4rem; }
.say img {
  width: 2.2rem; height: 2.2rem; flex: none; border-radius: 50%; object-fit: cover;
  background: var(--portrait-bg); border: 2px solid var(--line);
}
.say span {
  min-width: 0; padding: .3rem .8rem;
  border: 1px solid var(--line); border-radius: .9rem;
  background: var(--surface); font-size: .9rem;
}
.say[hidden] { display: none; }

.statusrow {
  display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  min-height: 3rem; margin-block: .35rem;
}
#status { margin: 0; font-size: .98rem; min-width: 0; }

/* board */
.frame {
  position: relative;
  display: grid;
  grid-template-columns: 1.4rem minmax(0, 1fr);
  grid-template-rows: 1.4rem auto;
}
.cols { grid-column: 2; grid-row: 1; display: grid; grid-template-columns: repeat(8, 1fr); }
.rows { grid-column: 1; grid-row: 2; display: grid; grid-template-rows: repeat(8, 1fr); }
.cols span, .rows span {
  display: grid; place-items: center;
  font-size: .72rem; color: var(--muted); letter-spacing: .04em;
}
.board {
  grid-column: 2; grid-row: 2;
  position: relative;
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  grid-template-rows: repeat(8, minmax(0, 1fr));
  aspect-ratio: 1;
  border-radius: .5rem;
  overflow: hidden;
  background-color: var(--board);
  background-image:
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.08)),
    radial-gradient(circle at 25% 25%, var(--grid) 0 .26rem, transparent .3rem),
    radial-gradient(circle at 75% 25%, var(--grid) 0 .26rem, transparent .3rem),
    radial-gradient(circle at 25% 75%, var(--grid) 0 .26rem, transparent .3rem),
    radial-gradient(circle at 75% 75%, var(--grid) 0 .26rem, transparent .3rem),
    linear-gradient(var(--grid) 1.5px, transparent 1.5px),
    linear-gradient(90deg, var(--grid) 1.5px, transparent 1.5px);
  background-size: auto, auto, auto, auto, auto, 12.5% 12.5%, 12.5% 12.5%;
  box-shadow: inset 0 0 0 2px var(--grid), 0 12px 32px rgba(0,0,0,.18);
}
.cell {
  position: relative;
  display: block;
  width: 100%; height: 100%;
  min-width: 0;
  padding: 0; margin: 0;
  border: 0;
  background: transparent;
  font: inherit;
  cursor: default;
  perspective: 260px;
  -webkit-tap-highlight-color: transparent;
}
.cell:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 6px; z-index: 4; }
.cell.live { cursor: pointer; }
.cell.live::before, .cell.tgt::before {
  content: ""; position: absolute; inset: 9%; border-radius: 50%;
}
.cell.live::before { opacity: 0; transition: opacity .12s; }
.board[data-human="b"] .cell.live::before { background: rgba(8, 10, 12, .55); }
.board[data-human="w"] .cell.live::before { background: rgba(255, 255, 255, .6); }
.cell.tgt { cursor: pointer; }
.cell.tgt::before {
  inset: 6%;
  border: 3px solid var(--accent);
  background: rgba(242, 182, 58, .22);
  z-index: 3;
  animation: pulse 1.1s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(.9); } }
.cell.hint::after {
  content: ""; position: absolute; inset: 40%; border-radius: 50%;
  background: var(--accent); opacity: .9;
  box-shadow: 0 0 0 3px rgba(242, 182, 58, .25);
}
@media (hover: hover) {
  .cell.live:hover::before { opacity: 1; }
  .cell.hint:hover::after { opacity: 0; }
}
.cell.last::after {
  content: ""; position: absolute; inset: 43%; border-radius: 50%;
  background: var(--accent); z-index: 2;
  box-shadow: 0 0 0 1px rgba(0,0,0,.35);
}
.cell.shake { animation: shake .3s; }
@keyframes shake {
  0%, 100% { translate: 0 0; }
  25% { translate: -3px 0; }
  75% { translate: 3px 0; }
}
.cell.fx { animation: fx .8s ease-out; }
@keyframes fx {
  0% { box-shadow: inset 0 0 0 0 rgba(242, 182, 58, .9); }
  40% { box-shadow: inset 0 0 0 .9rem rgba(242, 182, 58, .55); }
  100% { box-shadow: inset 0 0 0 0 rgba(242, 182, 58, 0); }
}

.stone {
  position: absolute; inset: 9%;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.3, .7, .25, 1);
  pointer-events: none;
}
.stone[data-c=""] { display: none; }
.stone[data-c="w"] { transform: rotateY(180deg); }
.stone.pop { animation: pop .25s ease-out; }
@keyframes pop { from { scale: .3; opacity: 0; } to { scale: 1; opacity: 1; } }
.face {
  position: absolute; inset: 0; border-radius: 50%;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.face.b {
  background: radial-gradient(circle at 34% 28%, var(--sb-hi), var(--sb-lo) 62%);
  box-shadow: 0 2px 4px rgba(0,0,0,.45), inset 0 -2px 3px rgba(0,0,0,.4);
}
.face.w {
  transform: rotateY(180deg);
  background: radial-gradient(circle at 34% 28%, var(--sw-hi), var(--sw-lo) 68%);
  box-shadow: 0 2px 4px rgba(0,0,0,.35), inset 0 -2px 3px rgba(0,0,0,.12);
}
.cell.lk .face.b, .cell.lk .face.w {
  box-shadow: 0 0 0 2.5px var(--accent), 0 2px 4px rgba(0,0,0,.4);
}

/* special move cut-in */
.cutin {
  grid-column: 2; grid-row: 2;
  position: absolute; inset: 1.4rem 0 0 1.4rem;
  display: grid; place-items: center;
  overflow: hidden;
  border-radius: .5rem;
  background: var(--scrim);
  color: var(--scrim-fg);
  z-index: 6;
}
.cutin::before {
  content: ""; position: absolute; left: -10%; right: -10%; top: 30%; height: 40%;
  background: var(--accent); opacity: .24;
  transform: skewY(-6deg);
}
.cutin-card {
  position: relative;
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 1rem;
  width: min(94%, 28rem); padding: .75rem;
}
.cutin.go .cutin-card { animation: slidein .45s cubic-bezier(.2, .8, .2, 1); }
@keyframes slidein { from { transform: translateX(-26%); opacity: 0; } to { transform: none; opacity: 1; } }
.cutin img {
  display: block; width: clamp(5rem, 26vw, 8.5rem); aspect-ratio: 1; object-fit: cover;
  border-radius: 1rem; border: 3px solid var(--accent); background: var(--portrait-bg);
}
.cutin-text { display: grid; gap: .25rem; min-width: 0; }
.cutin-who { margin: 0; font-size: .78rem; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
.cutin-name {
  margin: 0; font-family: var(--font-display); font-weight: 800;
  font-size: clamp(1.5rem, 6.5vw, 2.2rem); line-height: 1.2; letter-spacing: .04em; text-wrap: balance;
}
.cutin-line { margin: 0; font-size: .92rem; line-height: 1.5; }

.skillbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem; margin-top: .8rem; }
.skillbar[hidden] { display: none; }

/* panel */
.panel {
  display: grid; gap: 1.3rem; align-content: start;
  min-width: 0;
  padding: 1.1rem;
  border: 1px solid var(--line);
  border-radius: .9rem;
  background: var(--surface);
}
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend, h2 {
  padding: 0; margin: 0 0 .45rem;
  font-size: .8rem; font-weight: 700; letter-spacing: .06em; color: var(--muted);
}
.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: .2rem;
  padding: .2rem;
  border: 1px solid var(--line);
  border-radius: .65rem;
  background: var(--surface-2);
}
.seg label { position: relative; min-width: 0; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg span {
  display: block; text-align: center;
  padding: .5rem .3rem;
  border-radius: .45rem;
  font-size: .9rem; cursor: pointer;
  white-space: nowrap;
}
.seg input:checked + span { background: var(--primary); color: var(--on-primary); font-weight: 700; }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 1px; }
.note { margin: .45rem 0 0; font-size: .8rem; color: var(--muted); }

.picks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .4rem; }
.pick {
  position: relative; display: grid; gap: .25rem; justify-items: center; align-content: start;
  min-width: 0; cursor: pointer; text-align: center;
  font-size: .7rem; line-height: 1.25; color: var(--muted);
}
.pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pick img {
  display: block; width: 100%; aspect-ratio: 1; object-fit: cover;
  border-radius: .6rem; border: 2px solid var(--line); background: var(--portrait-bg);
}
.pick span { max-width: 100%; }
.pick input:checked ~ img { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
.pick input:checked ~ span { font-weight: 700; color: var(--fg); }
.pick input:focus-visible ~ img { outline: 3px solid var(--accent); outline-offset: 2px; }

.mu { display: grid; gap: .9rem; }
.mu-row { display: grid; grid-template-columns: 3rem minmax(0, 1fr); gap: .7rem; align-items: start; }
.mu-row img {
  display: block; width: 3rem; height: 3rem; border-radius: 50%; object-fit: cover;
  background: var(--portrait-bg); border: 2px solid var(--line);
}
.mu-row b { font-size: .92rem; }
.mu-row small { margin-left: .4rem; font-size: .72rem; color: var(--muted); font-weight: 400; }
.mu-row p { margin: .1rem 0 0; font-size: .82rem; line-height: 1.5; color: var(--muted); }
.mu-row em { font-style: normal; color: var(--fg); font-weight: 700; }
.rel { margin: 0; padding: 0; list-style: none; display: grid; gap: .3rem; font-size: .82rem; line-height: 1.5; }
.rel li { padding: .45rem .65rem; border-radius: .5rem; background: var(--surface-2); min-width: 0; }

.switch {
  position: relative;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  cursor: pointer; font-size: .95rem;
}
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track {
  flex: none; position: relative;
  width: 2.6rem; height: 1.5rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  transition: background .15s;
}
.track::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: calc(1.5rem - 6px); height: calc(1.5rem - 6px);
  border-radius: 50%;
  background: var(--fg); opacity: .55;
  transition: transform .15s, opacity .15s;
}
.switch input:checked + .track { background: var(--primary); border-color: var(--primary); }
.switch input:checked + .track::after { transform: translateX(1.1rem); background: var(--on-primary); opacity: 1; }
.switch input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 2px; }

.btns { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.btn {
  font: inherit; font-weight: 700; font-size: .92rem;
  padding: .65rem .8rem;
  border-radius: .6rem;
  cursor: pointer;
  white-space: nowrap;
}
.btn.primary { background: var(--primary); color: var(--on-primary); border: 1px solid var(--primary); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.skill {
  display: flex; align-items: center; justify-content: space-between; gap: .6rem;
  min-width: 0; text-align: left;
  padding: .7rem .95rem;
  background: var(--surface); color: var(--fg); border: 2px solid var(--line);
}
.btn.skill:disabled { opacity: .8; }
.btn.skill .sk-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.btn.skill .sk-state { flex: none; font-size: .8rem; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted); }
.btn.skill[data-ready="true"]:not(:disabled) {
  background: var(--accent); color: var(--on-accent); border-color: var(--accent);
  animation: ready 1.4s ease-in-out infinite;
}
.btn.skill[data-ready="true"]:not(:disabled) .sk-state { color: var(--on-accent); font-weight: 700; }
@keyframes ready { 50% { box-shadow: 0 0 0 5px rgba(242, 182, 58, .35); } }

.log {
  list-style: none; margin: 0; padding: 0;
  max-height: 13rem; overflow: auto;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .1rem .75rem;
  font-size: .9rem; font-variant-numeric: tabular-nums;
}
.log li { display: flex; align-items: center; gap: .5rem; padding: .15rem 0; min-width: 0; }
.log .no { width: 1.6rem; text-align: right; color: var(--muted); font-size: .75rem; flex: none; }
.log .pip { width: .8rem; height: .8rem; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--muted); }
.log .pip.b { background: #15191c; }
.log .pip.w { background: #ffffff; }
.log .sk { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log small { color: var(--muted); }
.empty { margin: 0; font-size: .88rem; color: var(--muted); }
.keys { margin: 0; font-size: .78rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .stone { transition: none; }
  .stone.pop, .cell.shake, .cell.fx, .cell.tgt::before, .cutin.go .cutin-card, .btn.skill { animation: none !important; }
  .bar i { transition: none; }
}
</style>

<main class="app">
  <header class="head">
    <h1>リバーシ</h1>
    <p class="lead">石をひっくり返すとゲージが溜まります。満タンになると、選んだキャラの必殺技が使えます。</p>
  </header>

  <div class="layout">
    <section class="stage" aria-label="対局">
      <div class="scores">
        <div class="pcard" id="cardB" data-active="true">
          <div class="avatar"><img id="avB" alt=""><span class="chip b"></span></div>
          <div class="who"><b id="nameB"></b><span id="whoB"></span></div>
          <span class="count" id="countB">2</span>
          <div class="gauge" id="gaugeB"><div class="bar"><i></i></div><small></small></div>
        </div>
        <div class="pcard" id="cardW" data-active="false">
          <div class="avatar"><img id="avW" alt=""><span class="chip w"></span></div>
          <div class="who"><b id="nameW"></b><span id="whoW"></span></div>
          <span class="count" id="countW">2</span>
          <div class="gauge" id="gaugeW"><div class="bar"><i></i></div><small></small></div>
        </div>
      </div>

      <p class="say" id="say" hidden><img id="sayImg" alt=""><span id="sayText"></span></p>

      <div class="statusrow">
        <p id="status" role="status" aria-live="polite">あなたの番です（黒）</p>
        <button id="again" class="btn primary" type="button" hidden>もう一度遊ぶ</button>
      </div>

      <div class="frame">
        <div class="cols" id="cols" aria-hidden="true"></div>
        <div class="rows" id="rows" aria-hidden="true"></div>
        <div class="board" id="board" role="group" aria-label="リバーシの盤面"></div>

      <fieldset>
        <legend>あなたのキャラ</legend>

      </fieldset>

      <fieldset>
        <legend>CPUのキャラ</legend>

      </fieldset>

      <section>
        <h2>必殺技と相性</h2>

      <fieldset>
        <legend>CPUの強さ</legend>

      <fieldset>
        <legend>あなたの色</legend>

          <label><input type="radio" name="side" value="b"><span>黒（先手）</span></label>
          <label><input type="radio" name="side" value="w"><span>白（後手）</span></label>

      <label class="switch">
        <span>置ける場所を表示</span>
        <input type="checkbox" id="hints">
        <span class="track"></span>
      </label>

      <div>
        <div class="btns">
          <button id="undo" class="btn ghost" type="button">一手戻す</button>
          <button id="restart" class="btn primary" type="button">新しいゲーム</button>
        </div>

      </div>

        <ol class="log" id="log"></ol>

// キャラ選択
function buildPicks(el, name) {
  el.innerHTML = ORDER.map(id => {
    const c = CHARS[id];
    return `<label class="pick"><input type="radio" name="${name}" value="${id}"><img src="${c.img}" alt=""><span>${c.name}</span></label>`;
  }).join('');
}

buildPicks($('picksCpu'), 'cpu');

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('reversi.settings') || '{}');
    if (['easy', 'normal', 'hard'].includes(s.level)) settings.level = s.level;
    if (s.side === 'b' || s.side === 'w') settings.side = s.side;
    if (typeof s.hints === 'boolean') settings.hints = s.hints;
    if (ORDER.includes(s.me)) settings.me = s.me;
    if (ORDER.includes(s.cpu)) settings.cpu = s.cpu;
  } catch (e) { /* storage unavailable */ }
}
function saveSettings() {
  try { localStorage.setItem('reversi.settings', JSON.stringify(settings)); } catch (e) { /* ignore */ }
}
function syncInputs() {
  document.querySelector(`input[name="level"][value="${settings.level}"]`).checked = true;
  document.querySelector(`input[name="side"][value="${settings.side}"]`).checked = true;
  document.querySelector(`input[name="me"][value="${settings.me}"]`).checked = true;
  document.querySelector(`input[name="cpu"][value="${settings.cpu}"]`).checked = true;
  $('hints').checked = settings.hints;
}

function mult(p) {
  const r = REL[chars[p] + '>' + chars[-p]];
  return r ? r[0] : 1;
}
function ready(p) { return gauge[p] >= SK[chars[p]].cost; }
function usable(p) {
  const kind = SK[chars[p]].kind;
  if (kind === 'extra') return hasMove(state.board, p);
  return targetsOf(state.board, p, kind).length > 0;
}
function canUse(p) {
  return !state.over && !busy && state.turn === p && ready(p) && state.doubleFor !== p && !state.targeting && usable(p);
}

// rendering
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function renderBoard() {
  const humanTurn = !state.over && !busy && state.turn === human;
  const targeting = humanTurn ? state.targeting : null;
  const legal = humanTurn && !targeting ? new Set(movesOf(state.board, human).map(m => m.i)) : new Set();
  const tgt = targeting ? new Set(targetsOf(state.board, human, targeting)) : new Set();
  boardEl.dataset.human = human === 1 ? 'b' : 'w';
  for (let i = 0; i < 64; i++) {
    const cell = cells[i];
    const stone = cell.firstChild;
    const v = state.board[i];
    const c = v === 1 ? 'b' : v === -1 ? 'w' : '';
    if (stone.dataset.c !== c) stone.dataset.c = c;
    cell.classList.toggle('live', humanTurn && !targeting && v === 0);
    cell.classList.toggle('hint', settings.hints && legal.has(i));
    cell.classList.toggle('tgt', tgt.has(i));
    cell.classList.toggle('lk', !!LOCK[i] && v !== 0);
    cell.classList.toggle('last', i === state.last && !targeting);
    const label = v === 1 ? '黒' : v === -1 ? '白' : (legal.has(i) ? '置ける' : '空き');
    cell.setAttribute('aria-label', coord(i) + ' ' + label + (LOCK[i] && v ? '（補強済み）' : '') + (tgt.has(i) ? '（対象にできる）' : ''));
  }
}
const PROMPT = {
  steal: '奪う相手の石を選んでください（角は選べません）。',
  remove: '叩いて取り除く相手の石を選んでください。',
  free: '石を置くマスを選んでください。空きマスならどこでも置けます。',
  lock: '補強の中心にする自分の石を選んでください。周囲8マスの自分の石も守られます。'
};
function renderCard(p, sfx) {
  const id = chars[p], c = CHARS[id], sk = SK[id];
  $('av' + sfx).src = c.img;
  $('name' + sfx).textContent = c.name;
  const g = $('gauge' + sfx);
  const pct = Math.min(1, gauge[p] / sk.cost);
  g.style.setProperty('--gc', c.color);
  g.querySelector('i').style.width = (pct * 100) + '%';
  g.dataset.ready = String(gauge[p] >= sk.cost);
  g.querySelector('small').textContent = gauge[p] >= sk.cost
    ? `${c.skill.name} 発動できます`
    : `${c.skill.name} ${Math.floor(gauge[p])}/${sk.cost}`;
}
function renderStatus() {
  const b = count(state.board, 1), w = count(state.board, -1);
  $('countB').textContent = b;
  $('countW').textContent = w;
  const bWin = state.over && b > w, wWin = state.over && w > b;
  $('whoB').textContent = (human === 1 ? 'あなた' : 'CPU') + '・黒' + (bWin ? '・勝ち' : '');
  $('whoW').textContent = (human === -1 ? 'あなた' : 'CPU') + '・白' + (wWin ? '・勝ち' : '');
  $('cardB').dataset.active = String(!state.over && state.turn === 1);
  $('cardW').dataset.active = String(!state.over && state.turn === -1);
  $('cardB').dataset.win = String(bWin);
  $('cardW').dataset.win = String(wWin);
  renderCard(1, 'B');
  renderCard(-1, 'W');

  let text;
  if (state.over) {
    const me = human === 1 ? b : w, cpu = human === 1 ? w : b;
    text = me > cpu ? `あなたの勝ちです（${me} 対 ${cpu}）`
         : me < cpu ? `CPUの勝ちです（${cpu} 対 ${me}）`
         : `引き分けです（${b} 対 ${w}）`;
  } else if (state.flash) {
    text = state.flash;
  } else if (state.targeting && state.turn === human) {
    text = PROMPT[state.targeting];
  } else if (busy && state.turn !== human) {
    text = `${CHARS[chars[state.turn]].name}が考えています…`;
  } else if (busy) {
    text = '必殺技発動！';
  } else {
    const color = state.turn === 1 ? '黒' : '白';
    const turn = state.turn === human ? `あなたの番です（${color}）` : `CPUの番です（${color}）`;
    text = (state.note ? state.note + ' ' : '') + turn;
    if (state.turn === human && ready(human) && state.doubleFor !== human) text += ' 必殺技が使えます。';
  }
  statusEl.textContent = text;
  $('again').hidden = !state.over;
  $('undo').disabled = busy || !history.some(s => s.turn === human);
  renderSkill();

  const mySide = human === 1 ? 'b' : 'w';
  $('pend').hidden = !(settings.side !== mySide || settings.me !== chars[human] || settings.cpu !== chars[-human]);
}
function renderSkill() {
  const id = chars[human], c = CHARS[id], sk = SK[id];
  const btn = $('skill');
  const rdy = ready(human);
  $('skName').textContent = `必殺技「${c.skill.name}」`;
  $('skState').textContent = rdy ? (state.doubleFor === human ? '発動中' : '発動する') : `${Math.floor(gauge[human])} / ${sk.cost}`;
  btn.dataset.ready = String(rdy);
  btn.disabled = !canUse(human);
  btn.title = c.skill.desc;
  $('cancel').hidden = !(state.targeting && state.turn === human && !busy);
}
function renderLog() {
  logEl.textContent = '';
  let n = 0;
  for (const e of log) {
    const li = el('li');
    const pip = el('span', 'pip ' + (e.p === 1 ? 'b' : 'w'));
    if (e.pass) {
      li.append(el('span', 'no'), pip, el('span', '', 'パス'));
    } else if (e.skill) {
      const label = el('span', 'sk', '★ ' + CHARS[e.skill].skill.name + (e.i !== undefined && e.i >= 0 ? ' ' + coord(e.i) : ''));
      li.append(el('span', 'no'), pip, label);
    } else {
      n++;
      const label = el('span', '', coord(e.i));
      label.append(el('small', '', ' +' + e.n));
      li.append(el('span', 'no', String(n)), pip, label);
    }
    logEl.appendChild(li);
  }
  $('logEmpty').hidden = log.length > 0;
  logEl.hidden = log.length === 0;
  logEl.scrollTop = logEl.scrollHeight;
}
function renderMatchup() {
  const me = settings.me, cpu = settings.cpu;
  const row = (id, who) => {
    const c = CHARS[id];
    return `<div class="mu-row"><img src="${c.img}" alt=""><div><b>${c.name}<small>${who}</small></b>` +
      `<p><em>${c.skill.name}</em>（ゲージ${SK[id].cost}）${c.skill.desc}</p></div></div>`;
  };
  const a = REL[me + '>' + cpu], b = REL[cpu + '>' + me];
  const rels = [];
  if (a) rels.push(`<li>あなたのゲージ ×${a[0]}（${a[1]}）</li>`);
  if (b) rels.push(`<li>CPUのゲージ ×${b[0]}（${b[1]}）</li>`);
  if (!rels.length) rels.push('<li>この組み合わせに特別な相性はありません。ゲージは標準の溜まり方です。</li>');
  $('matchup').innerHTML = row(me, 'あなた') + row(cpu, 'CPU') + `<ul class="rel">${rels.join('')}</ul>`;
}
function say(id, text) {
  const c = CHARS[id];
  $('say').hidden = false;
  $('sayImg').src = c.img;
  $('sayText').textContent = `${c.name}「${text}」`;
}
function sayEnd() {
  const b = count(state.board, 1), w = count(state.board, -1);
  const me = human === 1 ? b : w, cpu = human === 1 ? w : b;
  const id = chars[-human];
  if (me > cpu) say(id, CHARS[id].lose);
  else if (me < cpu) say(id, CHARS[id].win);
  else say(id, 'いい勝負でした！');
}
function render() {
  renderBoard();
  renderStatus();
  renderLog();
}
function setFlash(msg, ms) {
  state.flash = msg;
  renderStatus();
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { state.flash = ''; renderStatus(); }, ms);
}
function fx(list) {
  list.forEach(i => {
    const c = cells[i];
    c.classList.remove('fx');
    void c.offsetWidth;
    c.classList.add('fx');
    setTimeout(() => c.classList.remove('fx'), 900);
  });
}

// game flow
function snapshot() {
  return {
    board: state.board.slice(), turn: state.turn, last: state.last, logLen: log.length,
    gauge: { '1': gauge['1'], '-1': gauge['-1'] }, lock: LOCK.slice(), doubleFor: state.doubleFor
  };
}
function newGame() {
  token++;
  clearTimeout(flashTimer);
  $('cutin').hidden = true;
  human = settings.side === 'b' ? 1 : -1;
  chars = {};
  chars[human] = settings.me;
  chars[-human] = settings.cpu;
  gauge = { '1': 0, '-1': 0 };
  LOCK.fill(0);
  state.board = new Int8Array(64);
  state.board[27] = -1; state.board[36] = -1; state.board[28] = 1; state.board[35] = 1;
  state.turn = 1; state.last = -1; state.over = false; state.note = ''; state.flash = '';
  state.targeting = null; state.doubleFor = null;
  history = []; log = []; busy = false;
  say(chars[-human], CHARS[chars[-human]].start);
  render();
  renderMatchup();
  schedule();
}
function afterAction(p, keep) {
  const b = state.board, opp = -p;
  state.note = '';
  if (keep && hasMove(b, p)) {
    state.turn = p;
    state.note = p === human ? '二度打ち！もう一手どうぞ。' : 'CPUがもう一手打ちます。';
  } else if (hasMove(b, opp)) {
    state.turn = opp;
  } else if (hasMove(b, p)) {
    state.turn = p;
    state.note = `${opp === human ? 'あなた' : 'CPU'}は置ける場所がなく、パスしました。`;
    log.push({ p: opp, pass: true });
  } else {
    state.over = true;
  }
}
function placeStone(p, i, opts) {
  opts = opts || {};
  const flips = flipsAt(state.board, i, p);
  if (!opts.free && !flips.length) return false;
  if (!opts.skipSnap) history.push(snapshot());
  state.board[i] = p;
  for (const x of flips) state.board[x] = p;
  state.last = i;
  state.flash = '';
  if (opts.skill) log.push({ p, skill: opts.skill, i, n: flips.length });
  else log.push({ p, i, n: flips.length });
  gauge[p] = Math.min(SK[chars[p]].cost, gauge[p] + flips.length * mult(p));

  const r0 = (i / 8) | 0, c0 = i % 8;
  const dist = x => Math.max(Math.abs(((x / 8) | 0) - r0), Math.abs((x % 8) - c0));
  flips.sort((a, b) => dist(a) - dist(b));
  flips.forEach((x, k) => { cells[x].firstChild.style.transitionDelay = (k * 60 + 120) + 'ms'; });
  setTimeout(() => flips.forEach(x => { cells[x].firstChild.style.transitionDelay = ''; }), flips.length * 60 + 900);

  const keep = state.doubleFor === p;
  if (keep) state.doubleFor = null;
  afterAction(p, keep);
  busy = false;
  render();
  if (state.over) sayEnd();
  const stone = cells[i].firstChild;
  stone.classList.remove('pop');
  void stone.offsetWidth;
  stone.classList.add('pop');
  schedule();
  return true;
}

// special moves
async function showCutin(id) {
  const c = CHARS[id];
  $('cutImg').src = c.img;
  $('cutWho').textContent = c.name + ' の必殺技';
  $('cutName').textContent = c.skill.name;
  $('cutLine').textContent = '「' + c.skill.line + '」';
  const e = $('cutin');
  e.hidden = false;
  e.classList.remove('go');
  void e.offsetWidth;
  e.classList.add('go');
  await sleep(1500);
  e.hidden = true;
}
async function runSkill(p, target) {
  const t = token, id = chars[p], sk = SK[id], c = CHARS[id];
  busy = true;
  state.targeting = null;
  state.flash = '';
  history.push(snapshot());
  gauge[p] = 0;
  say(id, c.skill.line);
  render();
  await showCutin(id);
  if (t !== token) return;
  const b = state.board;
  if (sk.kind === 'extra') {
    state.doubleFor = p;
    log.push({ p, skill: id });
    finishSkill(p, hasMove(b, p));
    return;
  }
  if (sk.kind === 'free') {
    placeStone(p, target, { free: true, skipSnap: true, skill: id });
    return;
  }
  if (sk.kind === 'lock') {
    const set = lockSet(b, p, target);
    set.forEach(x => { LOCK[x] = 1; });
    log.push({ p, skill: id, i: target });
    fx(set);
  } else {
    state.board = applyTarget(b, p, sk.kind, target);
    log.push({ p, skill: id, i: target });
    fx([target]);
  }
  finishSkill(p, hasMove(state.board, p));
}
function finishSkill(p, keepTurn) {
  if (keepTurn) {
    state.turn = p;
    state.note = '';
  } else {
    afterAction(p, false);
  }
  busy = false;
  render();
  if (state.over) sayEnd();
  schedule();
}

// CPU
function cpuPlan(p) {
  const id = chars[p], sk = SK[id], b = state.board, lvl = settings.level;
  if (!ready(p) || state.doubleFor === p) return null;
  if (sk.kind === 'extra') {
    if (movesOf(b, p).length < 2) return null;
    return lvl === 'easy' && Math.random() < 0.5 ? null : { t: -1 };
  }
  const ts = targetsOf(b, p, sk.kind);
  if (!ts.length) return null;
  if (lvl === 'easy') return Math.random() < 0.5 ? { t: ts[(Math.random() * ts.length) | 0] } : null;
  if (sk.kind === 'lock') {
    let best = -1, bi = -1;
    for (const i of ts) {
      let s = 0;
      for (const x of lockSet(b, p, i)) if (!LOCK[x]) s += 1 + (CORNERS.includes(x) ? 3 : (x % 8 === 0 || x % 8 === 7 || x < 8 || x > 55) ? 1 : 0);
      if (s > best) { best = s; bi = i; }
    }
    return best >= 5 ? { t: bi } : null;
  }
  let base;
  if (sk.kind === 'free') {
    base = -Infinity;
    for (const m of movesOf(b, p)) base = Math.max(base, evaluate(applyTo(b, p, m), p));
    if (base === -Infinity) base = evaluate(b, p);
    base += 8;
  } else {
    base = evaluate(b, p) + 5;
  }
  let best = -Infinity, bi = -1;
  for (const i of ts) {
    const s = evaluate(applyTarget(b, p, sk.kind, i), p);
    if (s > best) { best = s; bi = i; }
  }
  return best > base ? { t: bi } : null;
}
function schedule() {
  if (state.over || state.turn === human) {
    busy = false;
    renderBoard();
    renderStatus();
    return;
  }
  busy = true;
  renderBoard();
  renderStatus();
  cpuTurn();
}
async function cpuTurn() {
  const t = token, p = state.turn;
  await sleep(560);
  if (t !== token) return;
  const plan = cpuPlan(p);
  if (plan) {
    await runSkill(p, plan.t);
    return;
  }
  const m = chooseMove(state.board, p, settings.level);
  if (m) placeStone(p, m.i);
}

function undo() {
  if (busy || !history.some(s => s.turn === human)) return;
  token++;
  let s;
  while (history.length) {
    s = history.pop();
    if (s.turn === human) break;
  }
  restore(s);
}
function restore(s) {
  state.board = Int8Array.from(s.board);
  LOCK.set(s.lock);
  gauge = { '1': s.gauge['1'], '-1': s.gauge['-1'] };
  state.turn = s.turn; state.last = s.last; state.over = false; state.note = ''; state.flash = '';
  state.targeting = null; state.doubleFor = s.doubleFor;
  log.length = s.logLen;
  busy = false;
  $('cutin').hidden = true;
  render();
  schedule();
}

// input
function shake(cell) {
  cell.classList.remove('shake');
  void cell.offsetWidth;
  cell.classList.add('shake');
}
boardEl.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  const i = +cell.dataset.i;
  if (state.over || busy || state.turn !== human) return;
  if (state.targeting) {
    if (targetsOf(state.board, human, state.targeting).includes(i)) runSkill(human, i);
    else {
      shake(cell);
      setFlash('そこは対象にできません。印のついたマスを選んでください。', 1800);
    }
    return;
  }
  if (state.board[i] !== 0) return;
  if (!flipsAt(state.board, i, human).length) {
    shake(cell);
    setFlash('そこには置けません。相手の石を挟める場所を選んでください。', 1800);
    return;
  }
  placeStone(human, i);
});
$('skill').addEventListener('click', () => {
  if (!canUse(human)) return;
  const kind = SK[chars[human]].kind;
  if (kind === 'extra') runSkill(human, -1);
  else { state.targeting = kind; render(); }
});
function cancelTarget() {
  if (!state.targeting) return;
  state.targeting = null;
  render();
}
$('cancel').addEventListener('click', cancelTarget);
document.addEventListener('keydown', e => { if (e.key === 'Escape') cancelTarget(); });

function setFocusable(i) {
  cells.forEach((c, k) => { c.tabIndex = k === i ? 0 : -1; });
  focusIdx = i;
}
boardEl.addEventListener('focusin', e => {
  const c = e.target.closest('.cell');
  if (c) setFocusable(+c.dataset.i);
});
boardEl.addEventListener('keydown', e => {
  if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const cur = +(document.activeElement && document.activeElement.dataset.i);
  if (Number.isNaN(cur)) return;
  let r = (cur / 8) | 0, c = cur % 8;
  if (e.key === 'ArrowUp') r = Math.max(0, r - 1);
  if (e.key === 'ArrowDown') r = Math.min(7, r + 1);
  if (e.key === 'ArrowLeft') c = Math.max(0, c - 1);
  if (e.key === 'ArrowRight') c = Math.min(7, c + 1);
  e.preventDefault();
  const ni = r * 8 + c;
  setFocusable(ni);
  cells[ni].focus();
});

function settingChanged() {
  saveSettings();
  renderMatchup();
  if (history.length === 0 && !busy) newGame(); else renderStatus();
}
document.querySelectorAll('input[name="level"]').forEach(inp => inp.addEventListener('change', () => {
  settings.level = inp.value; saveSettings();
}));
document.querySelectorAll('input[name="side"]').forEach(inp => inp.addEventListener('change', () => {
  settings.side = inp.value; settingChanged();
}));
document.querySelectorAll('input[name="me"]').forEach(inp => inp.addEventListener('change', () => {
  settings.me = inp.value; settingChanged();
}));
document.querySelectorAll('input[name="cpu"]').forEach(inp => inp.addEventListener('change', () => {
  settings.cpu = inp.value; settingChanged();
}));
$('hints').addEventListener('change', e => {
  settings.hints = e.target.checked; saveSettings(); renderBoard();
});
$('undo').addEventListener('click', undo);
$('restart').addEventListener('click', newGame);
$('again').addEventListener('click', newGame);

// start, with state carried across live updates
function serialize() {
  return {
    v: 2,
    board: Array.from(state.board), turn: state.turn, last: state.last, over: state.over,
    human, chars, gauge, lock: Array.from(LOCK), doubleFor: state.doubleFor, log,
    history: history.map(s => ({
      board: Array.from(s.board), turn: s.turn, last: s.last, logLen: s.logLen,
      gauge: s.gauge, lock: Array.from(s.lock), doubleFor: s.doubleFor
    }))
  };
}
function start(data) {
  loadSettings();
  syncInputs();
  renderMatchup();
  if (data && data.v === 2 && Array.isArray(data.board) && data.board.length === 64 && data.chars) {
    human = data.human === -1 ? -1 : 1;
    chars = data.chars;
    gauge = data.gauge;
    LOCK.set(data.lock);
    state.board = Int8Array.from(data.board);
    state.turn = data.turn; state.last = data.last; state.over = !!data.over;
    state.doubleFor = data.doubleFor; state.targeting = null; state.note = ''; state.flash = '';
    log = Array.isArray(data.log) ? data.log : [];
    history = Array.isArray(data.history) ? data.history.map(s => ({
      board: Int8Array.from(s.board), turn: s.turn, last: s.last, logLen: s.logLen,
      gauge: s.gauge, lock: Uint8Array.from(s.lock), doubleFor: s.doubleFor
    })) : [];
    busy = false;
    render();
    schedule();
  } else {
    newGame();
  }
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(serialize); } catch (e) { /* ignore */ }
let started = false;
const boot = d => { if (started) return; started = true; start(d); };
try {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data ? hot.data : {});
} catch (e) { boot({}); }
})();
